<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#060a1c"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="apple-mobile-web-app-capable" content="yes"><title>Nassah</title><link rel="icon" href="../img/logo-nassah.png">
<style>
@font-face{font-family:Jak;src:url(../fonts/plus-jakarta-sans-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Jak;src:url(../fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Jak;src:url(../fonts/plus-jakarta-sans-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
:root{--navy:#0a1a55;--bg:#060a1c;--red:#e3161b;--y:#ffc400;--b:#2f5bff;--g:#10b26a;--mut:#aab3d6;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Jak,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column}
.glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.5}
.gl1{width:320px;height:320px;background:var(--b);left:-120px;top:-80px}.gl2{width:300px;height:300px;background:var(--red);right:-140px;top:40%;opacity:.35}.gl3{width:260px;height:260px;background:var(--y);left:20%;bottom:-160px;opacity:.25}
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 44px) 18px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.brand em{font-style:normal;color:var(--y)}
.back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px}
.scr{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:6px 18px 18px;min-height:0}
.foot{position:relative;z-index:2;text-align:center;font-size:10.5px;color:#6e78a6;padding:0 0 calc(env(safe-area-inset-bottom) + 10px)}
h1{font-size:30px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
h1 span{color:var(--y)}
.lead{color:var(--mut);font-size:14.5px;line-height:1.5;margin-top:10px}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.mi{display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);text-align:left;transition:.2s var(--ease)}
.mi:active{transform:scale(.97)}
.mi .e{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.mi b{display:block;font-size:17px}.mi small{color:var(--mut);font-size:12.5px}
.big{height:56px;border-radius:18px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.big.r{background:linear-gradient(135deg,var(--red),#ff4d2e);box-shadow:0 10px 26px rgba(227,22,27,.4)}
.big.y{background:var(--y);color:#0c1230;box-shadow:0 10px 26px rgba(255,196,0,.35)}
.big.gl{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.fm{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.fm input,.fm select{height:50px;border-radius:15px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;padding:0 16px;font:600 16px Jak,sans-serif;outline:none}
.fm input::placeholder{color:#8891bb}
.fm select option{color:#000}
.fm input:focus{border-color:var(--y)}
.chk{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--mut)}
.chk input{width:18px;height:18px;accent-color:var(--y)}
/* tir */
.hud{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.hud div{flex:1;border-radius:16px;background:rgba(255,255,255,.08);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);font-weight:700}
.hud b{font-size:24px;color:#fff}
.hud .tm b{color:var(--y)}
.field{position:relative;flex:1;border-radius:26px;overflow:hidden;background:#e9f1ff;background-image:linear-gradient(rgba(10,26,85,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(10,26,85,.07) 2px,transparent 2px);background-size:56px 56px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 -60px 80px rgba(47,91,255,.12);touch-action:manipulation}
.field .sh{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.7),transparent 40%);pointer-events:none}
.mic{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;display:flex;align-items:center;justify-content:center;font-size:50px;animation:pop .25s var(--ease) both;filter:drop-shadow(0 6px 10px rgba(16,90,40,.35))}
.mic.gold{font-size:0}
.mic.gold img{width:62px;height:74px;object-fit:contain;filter:drop-shadow(0 0 14px #ffc400) drop-shadow(0 0 4px #ffc400)}
.mic.out{animation:shrink .2s ease-in both}
.mic.hit{animation:burst .32s ease-out both;pointer-events:none}
.fx{position:absolute;font-weight:800;font-size:22px;color:var(--g);pointer-events:none;animation:up .7s ease-out both;text-shadow:0 2px 0 #fff}
.fx.gd{color:#e09b00;font-size:28px}
.splash{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:4px solid rgba(16,178,106,.7);pointer-events:none;animation:ring .35s ease-out both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
@keyframes shrink{to{transform:scale(0);opacity:0}}
@keyframes burst{to{transform:scale(1.8);opacity:0;filter:blur(4px)}}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.ov{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:center;padding:24px;background:rgba(6,10,28,.88);backdrop-filter:blur(8px);border-radius:26px;text-align:center;overflow:auto}
.ov.hide{display:none}
.ov .e{font-size:64px;line-height:1;margin-bottom:12px}
.ov h2{font-size:26px;letter-spacing:-.02em}
.ov p{color:var(--mut);font-size:14px;margin:8px 0 18px;line-height:1.5}
.score{font-size:64px;font-weight:800;color:var(--y);line-height:1}
.gift{margin:14px 0 4px;border-radius:18px;padding:14px;background:rgba(255,196,0,.12);border:1px solid rgba(255,196,0,.4);font-weight:800}
.code{margin-top:16px;border-radius:18px;padding:16px;background:#fff;color:#0c1230}
.code small{display:block;font-size:12px;color:#5b6488;font-weight:700}
.code b{display:block;font-size:30px;letter-spacing:.08em;margin-top:4px}
.cd{font-size:110px;font-weight:800;color:var(--y);animation:cdp .9s ease-out both}
@keyframes cdp{from{transform:scale(2);opacity:0}30%{opacity:1}to{transform:scale(.9)}}
/* roue */
.wheelw{position:relative;width:min(84vw,330px);aspect-ratio:1;margin:8px auto 0}
.wheel{width:100%;height:100%;transition:transform 5s cubic-bezier(.12,.75,.12,1);filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.pin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #fff;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));z-index:2}
.hubb{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.hubb img{width:48px}
/* chasse */
.pass{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.stamp{border-radius:22px;aspect-ratio:1/.9;background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;position:relative;transition:.3s var(--ease)}
.stamp .e{font-size:34px;opacity:.35;filter:grayscale(1)}
.stamp b{font-size:14px}.stamp small{font-size:11.5px;color:var(--mut)}
.stamp.ok{border:2px solid var(--g);background:rgba(16,178,106,.14)}
.stamp.ok .e{opacity:1;filter:none}
.stamp.ok:after{content:"✓";position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.stamp.new{animation:stp .6s var(--ease)}
@keyframes stp{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.prog{margin-top:16px;height:12px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y));border-radius:8px;transition:width .5s var(--ease)}
.hint{margin-top:10px;font-size:13px;color:var(--mut);text-align:center}
.demob{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.demob button{height:38px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:700;color:#dfe5ff}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.lb{margin-top:16px;text-align:left;border-radius:18px;background:rgba(255,255,255,.05);padding:12px 14px}
.lb div{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:#dfe5ff}
.lb div.me{color:var(--y);font-weight:800}
</style></head><body>
